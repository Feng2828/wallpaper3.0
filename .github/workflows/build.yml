name: 编译 AlbumWallpaper APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置 Gradle 环境
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 云端自动修正构建脚本语法
        run: |
          # 修改变量名避免与 DSL 方法重名，本地文件保持不变
          sed -i "s/def keyPassword/def kpKey/g" app/build.gradle
          sed -i "s/keyPassword keyPassword/keyPassword kpKey/g" app/build.gradle
          # 移除固定版本号，自动匹配云端可用的构建工具
          sed -i "/buildToolsVersion/d" app/build.gradle

      - name: 执行 Release 编译
        run: gradle assembleRelease
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: 打包输出 APK
        uses: actions/upload-artifact@v4
        with:
          name: AlbumWallpaper-APK
          path: app/build/outputs/apk/release/*.apk
